[workspace]
resolver = "2"
members = ["crates/engine", "src-tauri"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
engine = { path = "crates/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
dirs = "6"
indexmap = "2"
toml = "0.8"
